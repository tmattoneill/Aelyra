[project]
name = "aelyra"
version = "1.0.0"
description = "AI-powered Spotify playlist generator"
authors = [{ name = "Matt O'Neill" }]
requires-python = ">=3.12"
# requirements.txt is the source of truth for installs (it is pinned and is what
# the deploy uses). This list exists so the project metadata is not a lie.
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.5",
    "SQLAlchemy>=2.0.41",
    "alembic>=1.14.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "openai>=1.99.9",
    "cachetools>=5.5.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["venv", ".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length is handled by the formatter, not worth failing on
]

[tool.ruff.lint.per-file-ignores]
# Model imports must follow the config setup, and exist to register tables.
"alembic/env.py" = ["E402"]
# Package re-exports.
"app/models/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
